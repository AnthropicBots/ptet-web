# .github/hiero-bot.yml — Hydra Maintainer config for AnthropicBots/ptet-web
# The bot stays silent in any repo without this file. Edits take effect after the
# file is pushed to the default branch (the bot clears its config cache on push).

repo: "AnthropicBots/ptet-web"

workflows:

  # Welcome first-time contributors on their first issue.
  # Owners, members, collaborators and past contributors are skipped by design.
  onboarding:
    enabled: true
    welcome_first_time_only: true
    max_concurrent_assignments: 3      # open issues one person may hold via /assign
    welcome_message: |
      Welcome to our ptet-web project! 🎉
      Thanks for contributing. Please read CONTRIBUTING.md before getting started.

  # Quality gates, AI review and labels on every PR (drafts are ignored).
  pull_request:
    enabled: true
    reviewer_recommendation: false     # off: real reviewer assignment (below) replaces suggestions
    quality_gates:
      require_dco: false               # this repo has no DCO check
      require_linked_issue: true       # PR description must contain "Closes/Fixes/Resolves #N"
      require_tests: false             # static website: tests are optional
      max_files_changed: 25            # ask contributors to split very large PRs
    # AI code review: runs when a PR is opened or reopened (not on every push).
    # Posts a scored summary comment plus up to max_comments inline comments.
    # Needs matching credentials on the bot server (OPENAI_API_KEY + OPENAI_BASE_URL).
    ai_review:
      enabled: true
      provider: openai
      model: "google/gemma-4-31b-it"
      focus_areas: [security, logic, style]
      max_comments: 5
    auto_label: true

  # Auto-request a reviewer when a PR is opened.
  # Candidates come from .github/reviewers.yml on main (available: true only).
  # The PR author is never picked. Every login there must be a repo collaborator.
  reviewer_assignment:
    enabled: true
    availability_file: ".github/reviewers.yml"
    reviewers_count: 1
    strategy: "round-robin"            # or "random"
    exclude_pr_author: true
    fallback_to_all_if_none_available: true
    notify_comment: "off"              # "mention" also comments "@reviewer please review this PR"

  # Health score (0-100). Weights are tuned for a website with no DCO check:
  # they sum to 1.0 and tests count for little.
  pr_health:
    enabled: true
    score_weights:
      has_tests: 0.10
      has_linked_issue: 0.25
      has_description: 0.25
      review_count: 0.25
      small_diff: 0.15
    label_healthy_above: 60            # 60+ -> "health: 💚 healthy"
    comment_threshold: 40              # only nag below this (or when labeled needs work)

  # After a merge: celebrate milestones and suggest next issues.
  # Suggestions come from OPEN, UNASSIGNED issues carrying the "intermediate" label.
  progression:
    enabled: true
    recommend_issues_after_merge: true
    celebrate_milestones: true

  # Scheduled scan: stale after 30 days, closed 7 days later, unassign after 7 idle days.
  # Issues labeled pinned / security / in-progress are exempt.
  issue_management:
    enabled: true
    stale_issue_days: 30
    close_stale_after_days: 7
    auto_unassign_inactive_days: 7
