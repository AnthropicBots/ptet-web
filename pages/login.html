<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | PTE HUB</title>

    <link rel="stylesheet" href="../styles/css/style.css" />
    <link rel="stylesheet" href="../styles/css/navbar.css" />
    <link rel="stylesheet" href="../styles/css/footer.css" />
    <link rel="stylesheet" href="../styles/css/login.css" />
    <link rel="stylesheet" href="../styles/css/theme.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <script src="../scripts/js/theme.js"></script>
  </head>

  <body>
    <header id="header">
      <div id="navbar-placeholder"></div>
    </header>

    <section class="login-page">
      <div class="login-container">
        <!-- Icon -->
        <div class="login-icon">
          <i class="fas fa-sign-in-alt"></i>
        </div>

        <h2>Welcome Back</h2>
        <p class="login-subtitle">Login to continue your PTE journey</p>

        <form class="login-form" id="loginForm">
          <!-- Email -->
          <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="Email Address" required />
          </div>

          <!-- Password with Toggle -->
          <div class="input-group password-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Password" required />
            <button type="button" class="toggle-password" aria-label="Show password">
              <i class="fas fa-eye"></i>
              <i class="fas fa-eye-slash"></i>
            </button>
          </div>

          <!-- Options -->
          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" />
              <span>Remember Me</span>
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Login Button -->
          <button type="submit" class="login-submit">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>

          <!-- Divider -->
          <div class="auth-divider">
            <span>or continue with</span>
          </div>

          <!-- Social Login -->
          <div class="social-login">
            <button class="google-login">
              <i class="fab fa-google"></i> Google
            </button>
            <button class="github-login">
              <i class="fab fa-github"></i> GitHub
            </button>
          </div>

          <!-- Register Link -->
          <p class="register-link">
            Don't have an account? <a href="register.html">Register</a>
          </p>
        </form>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="../scripts/js/rateLimiter.js"></script>
    <script src="../scripts/js/auth.js"></script>
    <script src="../scripts/js/navbar.js"></script>
    <script src="../scripts/js/footer.js"></script>
  </body>
</html>
